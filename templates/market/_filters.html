<form method="get" class="market-filters">
    <input type="search" name="search" value="{{ search }}" placeholder="Search player or team..." aria-label="Search players">
    <select name="position" aria-label="Filter by position">
        {% for value, label in position_choices %}
            <option value="{{ value }}" {% if selected_position == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
    <select name="team" aria-label="Filter by NFL team">
        <option value="">All teams</option>
        {% for team in teams %}
            <option value="{{ team.id }}" {% if selected_team == team.id|stringformat:"s" %}selected{% endif %}>
                {{ team.abbreviation }} — {{ team.name }}
            </option>
        {% endfor %}
    </select>
    {% if active_market_tab == 'long' %}
        <select name="signal" aria-label="Filter by market signal">
            <option value="">Market views</option>
            <option value="buy" {% if selected_signal == 'buy' %}selected{% endif %}>Buy</option>
            <option value="hold" {% if selected_signal == 'hold' %}selected{% endif %}>Hold</option>
            <option value="sell" {% if selected_signal == 'sell' %}selected{% endif %}>Sell</option>
        </select>
    {% endif %}
    {% if active_market_tab == 'short' %}
        <label class="market-week-control">Week
            <select name="week" aria-label="Projection week">
                {% for value in weeks %}
                    <option value="{{ value }}" {% if market_week == value %}selected{% endif %}>Week {{ value }}</option>
                {% endfor %}
            </select>
        </label>
    {% else %}
        <input type="hidden" name="week" value="{{ market_week }}">
    {% endif %}
    <input type="hidden" name="sort" value="{{ sort }}">
    <input type="hidden" name="direction" value="{{ direction }}">
    <button type="submit">Apply filters</button>
    <a class="market-clear" href="{% if active_market_tab == 'short' %}{% url 'market_short_term' %}{% else %}{% url 'market_long_term' %}{% endif %}">Clear</a>
</form>
