<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" fill="none">
  <defs>
    <pattern id="field-grid" width="80" height="64" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v64" stroke="#a7adb7" stroke-opacity=".19"/>
    </pattern>
    <linearGradient id="field-fade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity=".9"/>
      <stop offset=".55" stop-color="white" stop-opacity=".82"/>
      <stop offset="1" stop-color="white" stop-opacity=".68"/>
    </linearGradient>
    <mask id="fade-edges">
      <rect width="1600" height="680" fill="url(#field-fade)"/>
    </mask>
    <marker id="route-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 10 6 2 10" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g mask="url(#fade-edges)">
    <rect x="0" y="0" width="1600" height="680" fill="url(#field-grid)"/>
    <path d="M0 620H1600" stroke="#a7adb7" stroke-opacity=".38" stroke-dasharray="8 12"/>
    <path d="M160 20V640M400 20V640M800 20V640M1200 20V640M1440 20V640" stroke="#a7adb7" stroke-opacity=".24" stroke-dasharray="5 12"/>

    <g stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#route-arrow)">
      <!-- Go: straight up the left gutter, arrow stopping below the navigation. -->
      <path d="M120 620V18" stroke-opacity=".92"/>
      <!-- Inside: rise higher on the right, then cut in beside optimized points. -->
      <path d="M1560 620V340H1445" stroke-opacity=".9"/>
      <!-- Out: stem stays behind Current Lineup and only emerges at the sideline break. -->
      <path d="M520 620V455H14" stroke-opacity=".88"/>
      <!-- Flat: shallow, curved path ending beside the right-side receiver spot. -->
      <path d="M1450 620C1495 615 1520 575 1580 575" stroke-opacity=".9"/>
    </g>

    <g fill="#17191e" stroke="#ffcc00" stroke-width="3">
      <circle cx="120" cy="620" r="13"/>
      <circle cx="1560" cy="620" r="13"/>
    </g>

    <!-- Receivers and the offensive line share the line of scrimmage. Cards hide all but the center. -->
    <g fill="#17191e" stroke="#ffcc00" stroke-width="3">
      <circle cx="740" cy="620" r="13"/><circle cx="770" cy="620" r="13"/>
      <circle cx="800" cy="620" r="13"/><circle cx="830" cy="620" r="13"/>
      <circle cx="860" cy="620" r="13"/>
      <circle cx="800" cy="658" r="13"/>
    </g>
  </g>
</svg>
